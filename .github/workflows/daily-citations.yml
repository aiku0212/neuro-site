name: Daily citation check

# Refreshes citation counts and correction notices, queues new papers for human
# review, and publishes the site. A paper a maintainer approves in the review issue
# goes on a reading list, not the Sources page; nothing here adds sources or writes claims.
# If any step of either job fails, including job setup, nothing is published, the
# last good site stays up, and the report-failure job opens or comments on the
# "Citation check failed" issue with a link to the run.

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-citations
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # commit refreshed data
      issues: write     # review queue and failure notices
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Find the review issue
        id: issue
        run: |
          # Only the bot's own issue counts, and only collaborators can edit its body.
          number=$(gh issue list --author "app/github-actions" --label citation-review --state open \
            --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Apply reviewed papers
        if: steps.issue.outputs.number != ''
        run: |
          gh issue view "${{ steps.issue.outputs.number }}" --json body --jq .body > "$RUNNER_TEMP/issue.md"
          python scripts/apply_review.py "$RUNNER_TEMP/issue.md"

      - name: Note any gap since the last run
        # Warns (never fails) when the last committed run is days old, e.g. after the
        # schedule was paused. A schedule that never starts at all can only be caught
        # from outside this workflow.
        run: python scripts/check_freshness.py --warn-only

      - name: Check citations
        run: python scripts/daily_check.py --announce "$RUNNER_TEMP/announcement.md"

      - name: Build pages
        # Refuses to build if any reference is unconfirmed or a preprint.
        run: python scripts/build_refs.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data references.html
          git diff --cached --quiet || git commit -m "Daily citation check"
          git push

      - name: Update the review issue
        # Body edits send no notification, so anything new also gets a short comment.
        run: |
          number="${{ steps.issue.outputs.number }}"
          if [ -n "$number" ]; then
            # Ticks made since "Apply reviewed papers" read the body would be erased by
            # the edit. If it changed, leave it; the next run applies the ticks and updates it.
            gh issue view "$number" --json body --jq .body > "$RUNNER_TEMP/issue-now.md"
            if cmp -s "$RUNNER_TEMP/issue.md" "$RUNNER_TEMP/issue-now.md"; then
              gh issue edit "$number" --body-file data/review_issue.md
            else
              echo "::notice::The review issue changed during this run; the next run applies the new ticks."
            fi
          else
            gh label create citation-review --color 2D6A8F --force
            url=$(gh issue create --title "Citation review queue" --label citation-review --body-file data/review_issue.md)
            number="${url##*/}"
          fi
          if [ -s "$RUNNER_TEMP/announcement.md" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/announcement.md"
          fi

      - name: Record what was announced
        # Only once the comment is posted: if anything before this fails, the next run
        # announces the same items again. A duplicate comment is better than a lost one.
        run: |
          if [ -s "$RUNNER_TEMP/announcement.md" ]; then
            python scripts/daily_check.py --mark-announced "$RUNNER_TEMP/announcement.json"
            git add data
            git diff --cached --quiet || git commit -m "Record announced review items"
            git push
          fi

      - name: Confirm this run's data reached main
        # status.json changes every day; if it did not reach main, the schedule can lapse.
        # Compares commits, not dates, so a run that crosses midnight UTC still passes.
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Assemble the public site
        run: |
          mkdir _site
          for page in index app spike synapse pharma comparative timecells references about; do
            cp "$page.html" _site/
          done
          cp -R assets _site/
          test -f _site/assets/atlas.css

      - name: Package the site for Pages
        # Same archive actions/upload-pages-artifact makes; done here so every
        # action, including nested ones, is pinned to a commit.
        run: |
          tar --dereference --hard-dereference --directory _site \
            -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4

  report-failure:
    # A separate job, so it also runs when a job fails before its first step
    # (for example in "Set up job") and when the deploy fails.
    needs: [check, deploy]
    # A job that hits timeout-minutes is cancelled, which neither failure() nor
    # cancelled() (the whole workflow) reports, so the needs results are checked too.
    if: failure() || cancelled() || needs.check.result != 'success' || needs.deploy.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open or update the failure issue
        run: |
          body="The daily citation check did not finish (check: ${{ needs.check.result }}, deploy: ${{ needs.deploy.result }}), so this run did not update the live site; the last good version stays up. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          number=$(gh issue list --label check-failed --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh label create check-failed --color C0573A --force
            gh issue create --title "Citation check failed" --label check-failed --body "$body"
          fi
