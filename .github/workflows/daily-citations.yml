name: Daily citation check

# Refreshes citation counts and correction notices, queues new papers for human
# review, and publishes the site. New papers reach the site only after a
# maintainer ticks them in the review issue; nothing here writes claims.
# If any step fails, nothing is published, the last good site stays up, and the
# "Citation check failed" issue is opened or updated with a link to the run.

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-citations
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # commit refreshed data
      issues: write     # review queue and failure notices
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Find the review issue
        id: issue
        run: |
          # Only the bot's own issue counts, and only collaborators can edit its body.
          number=$(gh issue list --author "app/github-actions" --label citation-review --state open \
            --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Apply reviewed papers
        if: steps.issue.outputs.number != ''
        run: |
          gh issue view "${{ steps.issue.outputs.number }}" --json body --jq .body > "$RUNNER_TEMP/issue.md"
          python scripts/apply_review.py "$RUNNER_TEMP/issue.md"

      - name: Check citations
        run: python scripts/daily_check.py

      - name: Build pages
        # Refuses to build if any reference is unconfirmed.
        run: python scripts/build_refs.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data references.html index.html
          git diff --cached --quiet || git commit -m "Daily citation check"
          git push

      - name: Update the review issue
        run: |
          number="${{ steps.issue.outputs.number }}"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file data/review_issue.md
          else
            gh label create citation-review --color 2D6A8F --force
            gh issue create --title "Citation review queue" --label citation-review --body-file data/review_issue.md
          fi

      - name: Assemble the public site
        run: |
          mkdir _site
          for page in index app spike synapse pharma comparative timecells references about; do
            cp "$page.html" _site/
          done
          cp -R assets _site/
          test -f _site/assets/atlas.css

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site

      - name: Report a failure
        if: failure()
        run: |
          body="The daily citation check failed, so nothing was published. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          number=$(gh issue list --label check-failed --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh label create check-failed --color C0573A --force
            gh issue create --title "Citation check failed" --label check-failed --body "$body"
          fi

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
